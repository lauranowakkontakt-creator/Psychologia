<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Psycho — ikona aplikacji</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B45B8}a:hover{color:#45338F}
</style>
<div style="width: 640px; height: 1000px; box-sizing: border-box; padding: 56px; background: #E6DED1; font-family: 'Geist', system-ui, sans-serif; color: #1C1C1F; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 44px; font-weight: 400; letter-spacing: -0.02em">Ikona aplikacji</h1>
<div style="font-size: 15px; color: #5F5E66">Kartka z zakładką · noc i dzień</div>
</div>

<div style="display: flex; gap: 48px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="position: relative; width: 220px; height: 220px; border-radius: 50px; background: #15131F; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 34px rgba(28,28,31,0.2)">
<div aria-hidden="true" style="position: absolute; width: 170px; height: 170px; border-radius: 85px; background: #8FB4E8; opacity: 0.4; filter: blur(48px); bottom: -50px; left: -36px"></div>
<div style="position: relative; width: 112px; height: 136px; border-radius: 20px; background: rgba(255,255,255,0.10); border: 1.5px solid rgba(255,255,255,0.25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; padding: 42px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: absolute; top: -2px; right: 20px; width: 24px; height: 42px; background: #B9A6FF; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%)"></div>
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.7); width: 100%"></div>
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.45); width: 80%"></div>
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.45); width: 90%"></div>
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.3); width: 55%"></div>
</div>
</div>
<div style="font-size: 13px; color: #5F5E66">Noc</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="position: relative; width: 220px; height: 220px; border-radius: 50px; background: #F3EEE5; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 34px rgba(28,28,31,0.10)">
<div aria-hidden="true" style="position: absolute; width: 180px; height: 180px; border-radius: 90px; background: #C9D6FF; opacity: 0.8; filter: blur(48px); bottom: -60px; left: -48px"></div>
<div style="position: relative; width: 112px; height: 136px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1.5px solid #FFFFFF; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; padding: 42px 20px 0; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 14px rgba(28,28,31,0.06)">
<div style="position: absolute; top: -2px; right: 20px; width: 24px; height: 42px; background: #5B45B8; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%)"></div>
<div style="height: 6px; border-radius: 3px; background: #2A2A2F; width: 100%"></div>
<div style="height: 6px; border-radius: 3px; background: #B9B4C9; width: 80%"></div>
<div style="height: 6px; border-radius: 3px; background: #B9B4C9; width: 90%"></div>
<div style="height: 6px; border-radius: 3px; background: #D3CFDC; width: 55%"></div>
</div>
</div>
<div style="font-size: 13px; color: #5F5E66">Dzień</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; color: #5F5E66">Na ekranie telefonu</div>
<div style="display: flex; gap: 32px; padding: 24px 28px; border-radius: 28px; background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.9); align-self: flex-start">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="position: relative; width: 60px; height: 60px; border-radius: 14px; background: #15131F; overflow: hidden; display: flex; align-items: center; justify-content: center"><div aria-hidden="true" style="position: absolute; width: 46px; height: 46px; border-radius: 23px; background: #8FB4E8; opacity: 0.4; filter: blur(14px); bottom: -14px; left: -10px"></div><div style="position: relative; width: 31px; height: 37px; border-radius: 6px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); box-sizing: border-box; padding: 12px 6px 0; display: flex; flex-direction: column; gap: 4px"><div style="position: absolute; top: -1px; right: 5px; width: 7px; height: 12px; background: #B9A6FF; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%)"></div><div style="height: 2px; background: rgba(255,255,255,0.7)"></div><div style="height: 2px; background: rgba(255,255,255,0.45); width: 80%"></div><div style="height: 2px; background: rgba(255,255,255,0.45)"></div></div></div><div style="font-size: 12px">Psycho</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="position: relative; width: 60px; height: 60px; border-radius: 14px; background: #F3EEE5; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(28,28,31,0.08)"><div style="position: relative; width: 31px; height: 37px; border-radius: 6px; background: #FFFFFF; box-sizing: border-box; padding: 12px 6px 0; display: flex; flex-direction: column; gap: 4px"><div style="position: absolute; top: 0; right: 5px; width: 7px; height: 12px; background: #5B45B8; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%)"></div><div style="height: 2px; background: #2A2A2F"></div><div style="height: 2px; background: #B9B4C9; width: 80%"></div><div style="height: 2px; background: #B9B4C9"></div></div></div><div style="font-size: 12px">Psycho</div></div>
</div>
</div>

</div>
</body>
</html>
