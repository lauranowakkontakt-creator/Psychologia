<!doctype html>
<html lang="pl" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Motyw ustawiony przed pierwszym rysowaniem, żeby nie mignął zły (DESIGN.md: przełącznik). -->
    <script>
      (function () {
        var t = null
        try { t = JSON.parse(localStorage.getItem('psycho-theme')) } catch (e) {}
        if (t !== 'day' && t !== 'night') t = matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'
        document.documentElement.setAttribute('data-theme', t)
        var meta = document.createElement('meta')
        meta.name = 'theme-color'
        meta.content = t === 'day' ? '#F3EEE5' : '#0D0D11'
        document.head.appendChild(meta)
      })()
    </script>
    <meta name="description" content="Notatki z psychologii: studia i kursy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
