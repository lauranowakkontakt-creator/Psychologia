name: Testy

# Te same testy co lokalnie (npm run check) przy każdym pushu i pull requeście.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Publiczne repo nie ma prawdziwych notatek — testy idą wtedy na przykładowych.
      - run: '[ -d content ] || cp -R przyklad/content content'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wyniki-testow
          path: test-results/
          retention-days: 7
